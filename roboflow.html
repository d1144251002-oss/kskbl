<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>交通號誌辨識｜雲端模型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <span class="site">校園道路安全 AI 辨識專題</span>
    <h1>交通號誌 AI 辨識</h1>
    <p>照片會送到 Roboflow 雲端模型辨識，找出畫面中的交通號誌。需要網路連線。</p>
    <nav class="signs" aria-label="辨識模式"><a class="sign" href="index.html"><small>本機模型，離線辨識</small><b>斑馬線・視訊＋圖片</b></a><a class="sign" href="image.html"><small>本機模型，上傳照片</small><b>斑馬線・僅圖片</b></a><a class="sign" href="roboflow.html" aria-current="page"><small>Roboflow 模型</small><b>交通號誌・雲端</b></a></nav>
  </div>
</header>
<div class="centerline" aria-hidden="true"></div>
<main>
  <section class="stage-wrap" aria-label="辨識畫面">
    <div class="statusbar busy" id="statusbar"><span class="dot"></span><span id="status" role="status">準備中…</span></div>
    <div class="stage" id="stage">
      <div class="empty">
        <strong>把照片拖曳到這裡</strong>
        或使用右側的按鈕選擇圖片，也可以開啟視訊即時辨識。
      </div>
      <canvas id="outputCanvas" width="640" height="360"></canvas>
    </div>
  </section>
  <aside>
    <div class="panel"><h2>輸入</h2><div class="btns"><input type="file" id="imageInput" accept="image/*" disabled><label for="imageInput" class="btn ghost disabled" id="pickBtn">選擇圖片</label><button class="btn disabled" id="camBtn" type="button">開啟視訊</button><div class="fps" id="fps" aria-live="off"></div></div></div>
    <div class="panel"><h2>設定</h2>
      <div class="row"><label for="model">模型</label>
        <select id="model">
          <option value="-ftvco/001-mrbjp-1-rfdetr-small-t2">RF-DETR Small（較準）</option>
          <option value="001-mrbjp/1">YOLO26n（較快）</option>
        </select></div>
      <div class="row"><div class="lbl"><label for="conf">信心門檻</label><span id="confVal">25%</span></div>
        <input type="range" id="conf" min="5" max="90" value="25"></div>
      <p class="note">模型的召回率約 58%，門檻設太高會漏掉遠處的號誌。</p>
    </div>
    <div class="panel"><h2>辨識結果</h2><div class="result" id="report"><p>尚未辨識。</p></div></div>
  </aside>
</main>
<video id="video" playsinline muted hidden></video>
<footer>辨識結果僅供參考，實際道路安全請以現場勘查為準。</footer>
<script src="common.js"></script>
<script>

const PUBLISHABLE_KEY = 'rf_81ce3bTle7Phiy6kTJpkoSOnmMz2'; // 公開金鑰，可放在網頁；不要放私密 API key
const API_BASE = 'https://serverless.roboflow.com/';
const canvas = $('outputCanvas'), ctx = canvas.getContext('2d'), video = $('video');
let stream = null, running = false;
$('imageInput').disabled = false; $('pickBtn').classList.remove('disabled'); $('camBtn').classList.remove('disabled');
UI.status('請選擇圖片或開啟視訊。');
$('conf').addEventListener('input', () => $('confVal').textContent = $('conf').value + '%');

async function infer(src, sw, sh) {
  const k = Math.min(1, 640 / Math.max(sw, sh));
  const c = document.createElement('canvas'); c.width = Math.round(sw * k); c.height = Math.round(sh * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  const b64 = c.toDataURL('image/jpeg', 0.85).split(',')[1];
  // confidence 送很低的值，再由前端依滑桿過濾（避開 0-1 / 0-100 的單位差異）
  const res = await fetch(`${API_BASE}${$('model').value}?api_key=${PUBLISHABLE_KEY}&confidence=0.1`,
    { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: b64 });
  if (!res.ok) throw new Error(`Roboflow 回應 HTTP ${res.status}：${(await res.text()).slice(0, 100)}`);
  const j = await res.json(), iw = j.image?.width || c.width, ih = j.image?.height || c.height, min = $('conf').value / 100;
  return (j.predictions || []).filter(p => p.confidence >= min).map(p => ({
    x: (p.x - p.width / 2) * sw / iw, y: (p.y - p.height / 2) * sh / ih, w: p.width * sw / iw, h: p.height * sh / ih, score: p.confidence }));
}
function render(src, w, h, boxes) {
  UI.showMedia();
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  ctx.drawImage(src, 0, 0, w, h);
  const lw = Math.max(3, w / 220), fs = Math.max(15, w / 45);
  boxes.forEach(b => {
    ctx.strokeStyle = '#f2c230'; ctx.lineWidth = lw; ctx.strokeRect(b.x, b.y, b.w, b.h);
    const t = `號誌 ${(b.score * 100).toFixed(0)}%`; ctx.font = `700 ${fs}px "Noto Sans TC", sans-serif`;
    const tw = ctx.measureText(t).width, ly = Math.max(b.y, fs + 10);
    ctx.fillStyle = '#f2c230'; ctx.fillRect(b.x, ly - fs - 10, tw + 14, fs + 10);
    ctx.fillStyle = '#25282c'; ctx.fillText(t, b.x + 7, ly - 6);
  });
  const rep = $('report');
  rep.className = 'result' + (boxes.length ? ' safe' : '');
  rep.innerHTML = boxes.length
    ? `<div class="count">${boxes.length}</div><p>個交通號誌</p>`
    : '<h3>沒有找到號誌</h3><p>可以把信心門檻調低一點再試。</p>';
}
$('imageInput').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return; if (running) stopCamera();
  const img = new Image(); img.src = URL.createObjectURL(f);
  img.onload = async () => {
    render(img, img.width, img.height, []); UI.status('雲端辨識中…', 'busy');
    try {
      const t0 = performance.now(), boxes = await infer(img, img.width, img.height);
      render(img, img.width, img.height, boxes);
      UI.status(`辨識完成，用了 ${((performance.now() - t0) / 1000).toFixed(1)} 秒。`);
    } catch (err) { UI.status('辨識失敗：' + err.message, 'err'); console.error(err); }
  };
});
$('camBtn').addEventListener('click', () => running ? stopCamera() : startCamera());
async function startCamera() {
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 960 } }, audio: false }); }
  catch (e) { UI.status('無法開啟鏡頭：請允許瀏覽器使用攝影機，並確認網址是 https。', 'err'); return; }
  video.srcObject = stream; await video.play(); running = true;
  $('camBtn').textContent = '關閉視訊'; $('camBtn').classList.add('stop'); UI.status('視訊辨識中…', 'busy'); loop();
}
function stopCamera() {
  running = false; if (stream) stream.getTracks().forEach(t => t.stop()); stream = null;
  $('camBtn').textContent = '開啟視訊'; $('camBtn').classList.remove('stop'); $('fps').textContent = ''; UI.status('視訊已關閉。');
}
async function loop() {   // 一次只送一張，等回應再取下一張
  while (running) {
    const w = video.videoWidth, h = video.videoHeight; if (!w) { await new Promise(r => setTimeout(r, 100)); continue; }
    const t0 = performance.now();
    try { const boxes = await infer(video, w, h); if (!running) break; render(video, w, h, boxes); $('fps').textContent = `${(1000 / (performance.now() - t0)).toFixed(1)} FPS`; }
    catch (err) { UI.status('辨識失敗：' + err.message, 'err'); stopCamera(); return; }
  }
}

</script>
</body>
</html>
